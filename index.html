<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Tuning Analyser - Master Pro Edition</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0c;
      color: #e0e0e0;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #16161a;
      border: 1px solid #2a2a35;
      border-radius: 16px;
      padding: 18px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.7);
      box-sizing: border-box;
      text-align: center;
    }
    h1 { font-size: 1.2rem; margin-top: 0; color: #d0bcff; letter-spacing: 0.5px; }
    
    .config-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e24;
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid #2d2d38;
    }
    .config-group label { font-size: 0.8rem; color: #aaa; }
    .config-group input {
      width: 60px;
      background: #111115;
      border: 1px solid #d0bcff;
      color: #fff;
      padding: 4px;
      border-radius: 4px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
    }

    button {
      background: #d0bcff;
      color: #111;
      border: none;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      margin-bottom: 8px;
      width: 100%;
      transition: all 0.2s;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { background: #333; color: #778; cursor: not-allowed; transform: none; }
    button.btn-save { background: #00fabd; margin-top: 6px; }
    button.btn-clear { background: #ffb4ab; color: #300; font-size: 0.75rem; padding: 5px 10px; margin-top: 8px; width: auto; }

    .note-display { font-size: 2.8rem; font-weight: 800; color: #fff; margin: 0; line-height: 1; }
    .freq-display { font-size: 1rem; color: #00fabd; margin-bottom: 4px; }
    
    /* Stroboskop Canvas für ultra-präzises Tuning */
    .strobe-container {
      margin: 8px 0;
      background: #000;
      border-radius: 6px;
      border: 1px solid #333;
      overflow: hidden;
      height: 40px;
    }
    canvas#strobeCanvas {
      width: 100%;
      height: 40px;
    }

    .cents-display { font-size: 1.3rem; margin: 4px 0; font-weight: bold; }
    .cents-perfect { color: #00fabd; }
    .cents-off { color: #ffb4ab; }
    
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
      background: #1e1e24;
      padding: 8px;
      border-radius: 8px;
      text-align: left;
      font-size: 0.75rem;
      border: 1px solid #2d2d38;
    }
    .metrics div span { display: block; color: #8e8e99; }
    .metrics div strong { font-size: 0.85rem; color: #fff; }

    .section-title { font-size: 0.85rem; color: #d0bcff; margin: 12px 0 4px 0; text-align: left; font-weight: bold; }
    canvas#curveCanvas {
      width: 100%;
      height: 120px;
      background: #111115;
      border-radius: 6px;
      border: 1px solid #2d2d38;
    }
    .progress-bar { font-size: 0.75rem; color: #8e8e99; margin-top: 3px; }
    .legend {
      display: flex;
      justify-content: space-around;
      font-size: 0.7rem;
      margin-top: 4px;
      color: #aaa;
    }
    .legend span::before { content: "■ "; }
    .legend-dots::before { color: #00fabd; }
    .legend-line::before { color: #d0bcff; }
  </style>
</head>
<body>

<div class="card">
  <h1>Master Klavier-Stimmanalysator</h1>
  
  <div class="config-group">
    <label for="a4Input">Referenz A4 (Hz):</label>
    <input type="number" id="a4Input" value="440" step="0.1" min="400" max="480">
  </div>

  <button id="startBtn">1. Studio-Mikrofon starten</button>

  <div class="note-display" id="note">--</div>
  <div class="freq-display"><span id="freq">0.00</span> Hz</div>
  
  <!-- Stroboskop Indikator -->
  <div class="strobe-container">
    <canvas id="strobeCanvas" width="440" height="40"></canvas>
  </div>
  
  <div class="cents-display" id="centsContainer"><span id="cents">0.0</span> Cents</div>

  <div class="metrics">
    <div>
      <span>Reine Soll-Freq:</span>
      <strong id="pureTarget">-- Hz</strong>
    </div>
    <div>
      <span>Gespreizte Soll-Freq:</span>
      <strong id="stretchedTarget">-- Hz</strong>
    </div>
    <div>
      <span>Inharmonizität (B):</span>
      <strong id="inharmonicity">--</strong>
    </div>
    <div>
      <span>Spreizung (Offset):</span>
      <strong id="stretchCents">+0.0 Cts</strong>
    </div>
  </div>

  <button id="saveBtn" class="btn-save" disabled>2. Ton für Stimmkurve speichern</button>

  <div class="section-title">Inharmonizitäts-Profil (Multi-Partial Fit)</div>
  <canvas id="curveCanvas" width="400" height="120"></canvas>
  <div class="progress-bar" id="progressText">0 / 88 Tasten eingemessen</div>
  
  <div class="legend">
    <span class="legend-dots">Messpunkte</span>
    <span class="legend-line">Interpolierte Kurve</span>
  </div>

  <button id="clearBtn" class="btn-clear">Werksspeicher löschen</button>
</div>

<script>
let audioCtx, analyser, microphone;
let isListening = false;
let currentKeyNum = null;
let currentB = 0;
let strobePhase = 0;

let pianoData = JSON.parse(localStorage.getItem('piano_pro_raw')) || new Array(88).fill(null);
let smoothedB = new Array(88).fill(0);

const startBtn = document.getElementById('startBtn');
const saveBtn = document.getElementById('saveBtn');
const clearBtn = document.getElementById('clearBtn');
const a4Input = document.getElementById('a4Input');

const noteEl = document.getElementById('note');
const freqEl = document.getElementById('freq');
const centsEl = document.getElementById('cents');
const centsContainer = document.getElementById('centsContainer');
const pureTargetEl = document.getElementById('pureTarget');
const stretchedTargetEl = document.getElementById('stretchedTarget');
const inharmonicityEl = document.getElementById('inharmonicity');
const stretchCentsEl = document.getElementById('stretchCents');
const progressText = document.getElementById('progressText');

const canvas = document.getElementById('curveCanvas');
const ctx = canvas.getContext('2d');
const strobeCanvas = document.getElementById('strobeCanvas');
const sCtx = strobeCanvas.getContext('2d');

const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

updateGlobalModel();

startBtn.addEventListener('click', async () => {
  if (isListening) return;

  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // PROFESSIONELL: Erzwinge rohes Audiosignal ohne jegliche Browser-Filter
    const stream = await navigator.mediaDevices.getUserMedia({ 
      audio: {
        echoCancellation: false,
        autoGainControl: false,
        noiseSuppression: false,
        latencyHint: 'interactive'
      }, 
      video: false 
    });
    
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 32768; // Maximale FFT-Auflösung für tiefen Bass
    analyser.smoothingTimeConstant = 0.05; // Sofortige Erkennung ohne Verzögerung
    
    microphone = audioCtx.createMediaStreamSource(stream);
    microphone.connect(analyser);

    isListening = true;
    startBtn.innerText = "Pro-Analysator aktiv";
    startBtn.style.background = "#00fabd";
    startBtn.style.color = "#000";

    processAudio();
  } catch (err) {
    alert("Mikrofon-Zugriff fehlgeschlagen: " + err);
  }
});

saveBtn.addEventListener('click', () => {
  if (currentKeyNum !== null && currentKeyNum >= 1 && currentKeyNum <= 88 && currentB > 0) {
    pianoData[currentKeyNum - 1] = currentB;
    localStorage.setItem('piano_pro_raw', JSON.stringify(pianoData));
    updateGlobalModel();
  }
});

clearBtn.addEventListener('click', () => {
  if (confirm("Kompletten Stimm-Speicher zurücksetzen?")) {
    pianoData = new Array(88).fill(null);
    localStorage.removeItem('piano_pro_raw');
    updateGlobalModel();
  }
});

function getInterpolatedPeakBin(dataArray, bin) {
  if (bin <= 0 || bin >= dataArray.length - 1) return bin;
  const y1 = dataArray[bin - 1];
  const y2 = dataArray[bin];
  const y3 = dataArray[bin + 1];
  const p = 0.5 * (y1 - y3) / (y1 - 2 * y2 + y3);
  return bin + p;
}

function processAudio() {
  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Float32Array(bufferLength);
  
  function analyze() {
    if (!isListening) return;
    
    analyser.getFloatFrequencyData(dataArray);
    
    let maxVolume = -Infinity;
    let bestBin = -1;
    const nyquist = audioCtx.sampleRate / 2;
    
    const minBin = Math.floor((27.5 / nyquist) * bufferLength);
    const maxBin = Math.floor((4200 / nyquist) * bufferLength);

    for (let i = minBin; i < maxBin; i++) {
      if (dataArray[i] > maxVolume) {
        maxVolume = dataArray[i];
        bestBin = i;
      }
    }

    if (maxVolume > -50 && bestBin !== -1) {
      const exactPeakBin = getInterpolatedPeakBin(dataArray, bestBin);
      const fundFreq = exactPeakBin * (nyquist / bufferLength);
      const a4Freq = parseFloat(a4Input.value) || 440;
      
      // MULTI-PARTIAL ANALYSE: Suche bis zu 5 Teiltöne für High-End B-Berechnung
      let partials = [{n: 1, freq: fundFreq}];
      for (let n = 2; n <= 5; n++) {
        let expected = fundFreq * n;
        let found = findPartialPeak(dataArray, expected, nyquist, bufferLength);
        if (found > 0) partials.push({n: n, freq: found});
      }

      // Lineare Regression zur Bestimmung von B über mehrere Teiltöne: (f_n / (n*f_1))^2 - 1 = B * n^2
      currentB = 0;
      if (partials.length >= 2) {
        let sumNum = 0, sumDen = 0;
        let f1 = partials[0].freq;
        for (let p of partials) {
          if (p.n === 1) continue;
          let ratio = p.freq / (p.n * f1);
          let val = Math.pow(ratio, 2) - 1;
          sumNum += val * Math.pow(p.n, 2);
          sumDen += Math.pow(p.n, 4);
        }
        let calcB = sumNum / sumDen;
        if (!isNaN(calcB) && calcB >= 0.000005 && calcB <= 0.02) {
          currentB = calcB;
        }
      }

      saveBtn.disabled = (currentB === 0);

      const noteInfo = calculateTuning(fundFreq, a4Freq);
      currentKeyNum = noteInfo.keyNum;

      noteEl.innerText = noteInfo.note;
      freqEl.innerText = fundFreq.toFixed(2);
      pureTargetEl.innerText = noteInfo.pureTarget.toFixed(2) + " Hz";
      stretchedTargetEl.innerText = noteInfo.stretchedTarget.toFixed(2) + " Hz";
      
      centsEl.innerText = (noteInfo.cents >= 0 ? "+" : "") + noteInfo.cents.toFixed(1) + " Cts";
      stretchCentsEl.innerText = "+" + noteInfo.stretchCents.toFixed(1) + " Cts";
      
      if (Math.abs(noteInfo.cents) <= 1.5) {
        centsContainer.className = "cents-display cents-perfect";
      } else {
        centsContainer.className = "cents-display cents-off";
      }

      inharmonicityEl.innerText = currentB > 0 ? currentB.toExponential(2) : "Unstabil";
      inharmonicityEl.style.color = currentB > 0 ? "#fff" : "#ffb4ab";

      drawStrobe(noteInfo.cents);
    } else {
      drawStrobe(0, true); // Stillstand im Stroboskop bei Stille
    }

    requestAnimationFrame(analyze);
  }
  
  analyze();
}

function findPartialPeak(dataArray, targetFreq, nyquist, bufferLength) {
  const windowSize = Math.max(targetFreq * 0.03, 3);
  const minBin = Math.floor(((targetFreq - windowSize) / nyquist) * bufferLength);
  const maxBin = Math.floor(((targetFreq + windowSize) / nyquist) * bufferLength);
  
  let maxVol = -Infinity;
  let peakBin = -1;
  
  for (let i = minBin; i <= maxBin; i++) {
    if (dataArray[i] > maxVol) {
      maxVol = dataArray[i];
      peakBin = i;
    }
  }
  
  if (peakBin !== -1 && maxVol > -65) {
    return getInterpolatedPeakBin(dataArray, peakBin) * (nyquist / bufferLength);
  }
  return 0;
}

function calculateTuning(freq, a4Freq) {
  const noteNum = 12 * (Math.log(freq / a4Freq) / Math.log(2)) + 69;
  const roundedNote = Math.round(noteNum);
  const pureTarget = a4Freq * Math.pow(2, (roundedNote - 69) / 12);
  const keyNum = roundedNote - 20;

  let globalB = 0.0004;
  if (keyNum >= 1 && keyNum <= 88) {
    globalB = smoothedB[keyNum - 1] || 0.0004;
  }

  // Korrekte physikalische Oktavspreizung basierend auf B
  const stretchFactor = Math.sqrt(1 + globalB * 4);
  const stretchedTarget = pureTarget * stretchFactor;
  
  const cents = 1200 * (Math.log(freq / stretchedTarget) / Math.log(2));
  const stretchCents = 1200 * (Math.log(stretchedTarget / pureTarget) / Math.log(2));
  
  const noteIndex = (roundedNote % 12 + 12) % 12;
  const octave = Math.floor(roundedNote / 12) - 1;
  
  return {
    keyNum: keyNum,
    note: NOTE_NAMES[noteIndex] + octave,
    pureTarget: pureTarget,
    stretchedTarget: stretchedTarget,
    cents: cents,
    stretchCents: stretchCents
  };
}

// Stroboskop-Animation rendering
function drawStrobe(cents, idle = false) {
  sCtx.fillStyle = '#0a0a0c';
  sCtx.fillRect(0, 0, strobeCanvas.width, strobeCanvas.height);

  if (idle) return;

  strobePhase += cents * 0.15; // Geschwindigkeit und Richtung der Muster-Bewegung
  
  sCtx.fillStyle = Math.abs(cents) < 1.5 ? '#00fabd' : '#d0bcff';
  const barWidth = 12;
  const spacing = 30;
  
  for (let x = (strobePhase % spacing) - spacing; x < strobeCanvas.width; x += spacing) {
    sCtx.fillRect(x, 0, barWidth, strobeCanvas.height);
  }
}

// Robuste globale Interpolation über Polynom-Glättung
function updateGlobalModel() {
  const points = [];
  pianoData.forEach((val, idx) => {
    if (val !== null && val > 0) {
      points.push({ x: idx + 1, y: Math.log(val) });
    }
  });

  const validCount = points.length;
  progressText.innerText = `${validCount} / 88 Tasten eingemessen`;

  if (validCount >= 2) {
    let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
    points.forEach(p => {
      sumX += p.x;
      sumY += p.y;
      sumXY += p.x * p.y;
      sumXX += p.x * p.x;
    });
    const slope = (validCount * sumXY - sumX * sumY) / (validCount * sumXX - sumX * sumX);
    const intercept = (sumY - slope * sumX) / validCount;

    for (let i = 0; i < 88; i++) {
      smoothedB[i] = Math.exp(intercept + slope * (i + 1));
    }
  } else {
    // Akustisch fundiertes Standard-Modell für ein Standard-Klavier, wenn noch keine Messwerte da sind
    for (let i = 0; i < 88; i++) {
      let key = i + 1;
      // Diskant hat steilere Inharmonizität als Bass
      smoothedB[i] = 0.0002 * Math.pow(1.025, 88 - key) + 0.00005;
    }
  }

  drawGraph(points);
}

function drawGraph(points) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#22222a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, canvas.height / 2);
  ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.stroke();

  // Zeichne geglättete Kurve
  ctx.strokeStyle = '#d0bcff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 88; i++) {
    const x = (i / 87) * (canvas.width - 20) + 10;
    const logVal = Math.log10(smoothedB[i]);
    const y = canvas.height - ((logVal + 4.5) / 2.5) * canvas.height;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Zeichne echte Messpunkte
  ctx.fillStyle = '#00fabd';
  pianoData.forEach((val, idx) => {
    if (val !== null && val > 0) {
      const x = (idx / 87) * (canvas.width - 20) + 10;
      const logVal = Math.log10(val);
      const y = canvas.height - ((logVal + 4.5) / 2.5) * canvas.height;
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}
</script>

</body>
</html>
