<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano Tuning Analyser - Master Pro Edition</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0c;
    color: #e0e0e0;
    margin: 0;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .card {
    background: #16161a;
    border: 1px solid #2a2a35;
    border-radius: 16px;
    padding: 18px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.7);
    box-sizing: border-box;
    text-align: center;
  }
  h1 { font-size: 1.2rem; margin-top: 0; color: #d0bcff; letter-spacing: 0.5px; }

  .config-group {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1e1e24;
    padding: 6px 12px;
    border-radius: 8px;
    margin-bottom: 10px;
    border: 1px solid #2d2d38;
  }
  .config-group label { font-size: 0.8rem; color: #aaa; }
  .config-group input {
    width: 60px;
    background: #111115;
    border: 1px solid #d0bcff;
    color: #fff;
    padding: 4px;
    border-radius: 4px;
    text-align: center;
    font-size: 0.9rem;
    font-weight: bold;
  }

  button {
    background: #d0bcff;
    color: #111;
    border: none;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
    margin-bottom: 8px;
    width: 100%;
    transition: all 0.2s;
  }
  button:hover { opacity: 0.9; transform: translateY(-1px); }
  button:disabled { background: #333; color: #778; cursor: not-allowed; transform: none; }
  button.btn-save { background: #00fabd; margin-top: 6px; }
  
  .action-buttons-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }

  button.btn-undo { 
    background: #ffdcc8; 
    color: #351000; 
    font-size: 0.75rem; 
    padding: 6px 12px; 
    width: auto; 
    margin-bottom: 0;
  }

  button.btn-clear { 
    background: #ffb4ab; 
    color: #300; 
    font-size: 0.75rem; 
    padding: 6px 12px; 
    width: auto; 
    margin-bottom: 0;
  }

  .note-display { font-size: 2.8rem; font-weight: 800; color: #fff; margin: 0; line-height: 1; }
  .freq-display { font-size: 1rem; color: #00fabd; margin-bottom: 4px; }
  
  .mode-badge {
    display: inline-block;
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 12px;
    background: #333;
    color: #aaa;
    margin-bottom: 8px;
    font-weight: bold;
  }
  .mode-fast { background: #443311; color: #ffb4ab; }
  .mode-deep { background: #004433; color: #00fabd; }
  .mode-hold { background: #002244; color: #80c3ff; }

  .strobe-container {
    margin: 8px 0;
    background: #000;
    border-radius: 6px;
    border: 1px solid #333;
    overflow: hidden;
    height: 40px;
  }
  canvas#strobeCanvas {
    width: 100%;
    height: 40px;
  }

  .cents-display { font-size: 1.3rem; margin: 4px 0; font-weight: bold; }
  .cents-perfect { color: #00fabd; }
  .cents-off { color: #ffb4ab; }

  .metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 8px;
    background: #1e1e24;
    padding: 8px;
    border-radius: 8px;
    text-align: left;
    font-size: 0.75rem;
    border: 1px solid #2d2d38;
  }
  .metrics div span { display: block; color: #8e8e99; }
  .metrics div strong { font-size: 0.85rem; color: #fff; }

  .section-title { font-size: 0.85rem; color: #d0bcff; margin: 12px 0 4px 0; text-align: left; font-weight: bold; }
  canvas#curveCanvas {
    width: 100%;
    height: 120px;
    background: #111115;
    border-radius: 6px;
    border: 1px solid #2d2d38;
  }
  .progress-bar { font-size: 0.75rem; color: #8e8e99; margin-top: 3px; }
  .legend {
    display: flex;
    justify-content: space-around;
    font-size: 0.7rem;
    margin-top: 4px;
    color: #aaa;
  }
  .legend span::before { content: "■ "; }
  .legend-dots::before { color: #00fabd; }
  .legend-line::before { color: #d0bcff; }
</style>
</head>
<body>

<div class="card">
  <h1>Master Klavier-Stimmanalysator</h1>

  <div class="config-group">
    <label for="a4Input">Referenz A4 (Hz):</label>
    <input type="number" id="a4Input" value="440" step="0.1" min="400" max="480">
  </div>

  <button id="startBtn">1. Studio-Mikrofon starten</button>

  <div class="mode-badge" id="modeBadge">Standby</div>
  <div class="note-display" id="note">--</div>
  <div class="freq-display"><span id="freq">0.00</span> Hz</div>

  <div class="strobe-container">
    <canvas id="strobeCanvas" width="440" height="40"></canvas>
  </div>

  <div class="cents-display" id="centsContainer"><span id="cents">0.0</span> Cents</div>

  <div class="metrics">
    <div>
      <span>Reine Soll-Freq:</span>
      <strong id="pureTarget">-- Hz</strong>
    </div>
    <div>
      <span>Gespreizte Soll-Freq:</span>
      <strong id="stretchedTarget">-- Hz</strong>
    </div>
    <div>
      <span>Inharmonizität (B):</span>
      <strong id="inharmonicity">--</strong>
    </div>
    <div>
      <span>Spreizung (Offset):</span>
      <strong id="stretchCents">+0.0 Cts</strong>
    </div>
  </div>

  <button id="saveBtn" class="btn-save" disabled>2. Ton für Stimmkurve speichern</button>

  <div class="section-title">Inharmonizitäts-Profil (Robust Fit)</div>
  <canvas id="curveCanvas" width="400" height="120"></canvas>
  <div class="progress-bar" id="progressText">0 / 88 Tasten eingemessen</div>

  <div class="legend">
    <span class="legend-dots">Messpunkte</span>
    <span class="legend-line">Wannen-Modell (Adaptiv)</span>
  </div>

  <div class="action-buttons-row">
    <button id="undoBtn" class="btn-undo">Letzten Wert löschen</button>
    <button id="clearBtn" class="btn-clear">Werksspeicher löschen</button>
  </div>
</div>

<script>
let audioCtx, analyserFast, analyserDeep, microphone;
let isListening = false;

const FAST_FFT_SIZE = 4096;
let DEEP_FFT_SIZE = 32768;

const dataTimeFast = new Float32Array(FAST_FFT_SIZE);
let dataTimeDeep = new Float32Array(DEEP_FFT_SIZE);
const dataFreqFast = new Float32Array(FAST_FFT_SIZE / 2);
let dataFreqDeep = new Float32Array(DEEP_FFT_SIZE / 2);

// Zustands- und Hysterese-Variablen
let currentKeyNum = null;
let noteStartTimeMs = 0;
let lastValidSignalMs = 0;

// Dual-Hybrid Variable: Anker-Frequenz zum Halten des Signals
let lockedF0 = -1;

let medianBHistory = [];
let medianF0History = [];

let currentB = 0;
let smoothedF0 = 0;
let strobePhase = 0;

let signalHoldCounter = 0;
const SIGNAL_HOLD_FRAMES = 180; 

let lastCents = 0;

let pianoData = JSON.parse(localStorage.getItem('piano_pro_raw')) || new Array(88).fill(null);
let saveHistory = JSON.parse(localStorage.getItem('piano_pro_history')) || [];
let smoothedBModel = new Array(88).fill(0);

// UI Elemente
const startBtn = document.getElementById('startBtn');
const saveBtn = document.getElementById('saveBtn');
const undoBtn = document.getElementById('undoBtn');
const clearBtn = document.getElementById('clearBtn');
const a4Input = document.getElementById('a4Input');
const noteEl = document.getElementById('note');
const freqEl = document.getElementById('freq');
const centsEl = document.getElementById('cents');
const centsContainer = document.getElementById('centsContainer');
const pureTargetEl = document.getElementById('pureTarget');
const stretchedTargetEl = document.getElementById('stretchedTarget');
const inharmonicityEl = document.getElementById('inharmonicity');
const stretchCentsEl = document.getElementById('stretchCents');
const progressText = document.getElementById('progressText');
const modeBadge = document.getElementById('modeBadge');

const canvas = document.getElementById('curveCanvas');
const ctx = canvas.getContext('2d');
const strobeCanvas = document.getElementById('strobeCanvas');
const sCtx = strobeCanvas.getContext('2d');

const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

updateGlobalModel();

startBtn.addEventListener('click', async () => {
  if (isListening) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false },
      video: false
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    analyserFast = audioCtx.createAnalyser();
    analyserFast.fftSize = FAST_FFT_SIZE;
    analyserFast.smoothingTimeConstant = 0.0;

    analyserDeep = audioCtx.createAnalyser();
    try {
      analyserDeep.fftSize = DEEP_FFT_SIZE;
    } catch(e) {
      DEEP_FFT_SIZE = 16384;
      analyserDeep.fftSize = DEEP_FFT_SIZE;
      dataTimeDeep = new Float32Array(DEEP_FFT_SIZE);
      dataFreqDeep = new Float32Array(DEEP_FFT_SIZE / 2);
    }
    analyserDeep.smoothingTimeConstant = 0.0;

    microphone = audioCtx.createMediaStreamSource(stream);
    microphone.connect(analyserFast);
    microphone.connect(analyserDeep);

    isListening = true;
    startBtn.innerText = "Pro-Analysator aktiv";
    startBtn.style.background = "#00fabd";
    startBtn.style.color = "#000";

    processAudio();
  } catch (err) {
    alert("Mikrofon-Zugriff fehlgeschlagen: " + err);
  }
});

saveBtn.addEventListener('click', () => {
  if (currentKeyNum !== null && currentKeyNum >= 1 && currentKeyNum <= 88 && currentB > 0) {
    const keyIndex = currentKeyNum - 1;
    pianoData[keyIndex] = currentB;
    
    // Reihenfolge für Rückgängig-Funktion speichern
    saveHistory = saveHistory.filter(k => k !== keyIndex); // Duplikate entfernen
    saveHistory.push(keyIndex);

    localStorage.setItem('piano_pro_raw', JSON.stringify(pianoData));
    localStorage.setItem('piano_pro_history', JSON.stringify(saveHistory));
    updateGlobalModel();
  }
});

undoBtn.addEventListener('click', () => {
  if (saveHistory.length > 0) {
    const lastKeyIndex = saveHistory.pop();
    pianoData[lastKeyIndex] = null;

    localStorage.setItem('piano_pro_raw', JSON.stringify(pianoData));
    localStorage.setItem('piano_pro_history', JSON.stringify(saveHistory));
    updateGlobalModel();
  } else {
    alert("Keine gespeicherten Werte zum Löschen vorhanden.");
  }
});

clearBtn.addEventListener('click', () => {
  if (confirm("Kompletten Stimm-Speicher zurücksetzen?")) {
    pianoData = new Array(88).fill(null);
    saveHistory = [];
    localStorage.removeItem('piano_pro_raw');
    localStorage.removeItem('piano_pro_history');
    updateGlobalModel();
  }
});

function getInterpolatedPeakBin(dataArray, bin) {
  if (bin <= 0 || bin >= dataArray.length - 1) return bin;
  const y1 = dataArray[bin - 1];
  const y2 = dataArray[bin];
  const y3 = dataArray[bin + 1];
  const p = 0.5 * (y1 - y3) / (y1 - 2 * y2 + y3);
  return bin + p;
}

function getMedian(arr) {
  if(arr.length === 0) return 0;
  const sorted = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

function getPitchYIN(buffer, sampleRate) {
  const minFreq = 25; const maxFreq = 4500;
  const W = Math.floor(buffer.length / 2);
  const minTau = Math.max(2, Math.floor(sampleRate / maxFreq));
  const maxTau = Math.min(W, Math.ceil(sampleRate / minFreq));

  let yinBuffer = new Float32Array(maxTau + 1);
  for (let t = 1; t <= maxTau; t++) {
    let sum = 0;
    for (let i = 0; i < W; i++) {
      let delta = buffer[i] - buffer[i + t];
      sum += delta * delta;
    }
    yinBuffer[t] = sum;
  }
  yinBuffer[0] = 1;
  let runningSum = 0;
  let tauEstimate = -1;
  const threshold = 0.25;

  for (let t = 1; t <= maxTau; t++) {
    runningSum += yinBuffer[t];
    yinBuffer[t] = yinBuffer[t] * t / runningSum;
    if (t >= minTau && yinBuffer[t] < threshold) {
      while (t + 1 <= maxTau && yinBuffer[t + 1] < yinBuffer[t]) t++;
      tauEstimate = t; break;
    }
  }

  if (tauEstimate === -1) {
    let minVal = Infinity;
    for (let t = minTau; t <= maxTau; t++) {
      if (yinBuffer[t] < minVal) { minVal = yinBuffer[t]; tauEstimate = t; }
    }
  }

  if (tauEstimate > 0 && tauEstimate < maxTau) {
    let s0 = yinBuffer[tauEstimate - 1];
    let s1 = yinBuffer[tauEstimate];
    let s2 = yinBuffer[tauEstimate + 1];
    let denominator = 2 * (s0 + s2 - 2 * s1);
    if (denominator !== 0) tauEstimate += (s0 - s2) / denominator;
  }
  return tauEstimate > 0 ? sampleRate / tauEstimate : -1;
}

function extractDataFromSpectrum(f0Guide, dataFreqArray, hzPerBin, nyquist) {
  let exactF0 = f0Guide;
  let partial1 = findPartialPeak(dataFreqArray, f0Guide * 0.96, f0Guide * 1.04, hzPerBin);
  if (partial1 && partial1.vol > -98) {
    exactF0 = partial1.freq;
  }

  let partials = [];
  if (partial1) partials.push({n: 1, freq: exactF0, vol: partial1.vol});

  for (let n = 2; n <= 8; n++) {
    let harmonicNominal = exactF0 * n;
    if (harmonicNominal > nyquist * 0.9) break;

    let minHz = harmonicNominal * 0.96;
    let maxHz = harmonicNominal * (1 + 0.0015 * n * n + 0.03);

    let found = findPartialPeak(dataFreqArray, minHz, maxHz, hzPerBin);
    if (found) partials.push({n: n, freq: found.freq, vol: found.vol});
  }

  let calcB = 0;
  if (partials.length >= 3) {
    let N = partials.length;
    let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
    for (let p of partials) {
      let x = p.n * p.n;
      let y = (p.freq * p.freq) / (p.n * p.n);
      sumX += x; sumY += y; sumXY += x * y; sumX2 += x * x;
    }
    let denominator = (N * sumX2) - (sumX * sumX);
    if (denominator !== 0) {
      let m = ((N * sumXY) - (sumX * sumY)) / denominator;
      let c = (sumY - (m * sumX)) / N;
      if (c > 0 && m > 0) calcB = m / c;
    }
  }
  return { exactF0, calcB };
}

function processAudio() {
  function analyze() {
    if (!isListening) return;

    analyserFast.getFloatTimeDomainData(dataTimeFast);
    let rms = 0;
    for (let i = 0; i < FAST_FFT_SIZE; i++) rms += dataTimeFast[i] * dataTimeFast[i];
    rms = Math.sqrt(rms / FAST_FFT_SIZE);

    const now = Date.now();

    if (rms > 0.0003) {
      const sampleRate = audioCtx.sampleRate;
      const nyquist = sampleRate / 2;
      
      const isDeepReady = (now - noteStartTimeMs) > 600;
      let yinF0 = -1;

      if (!isDeepReady) {
        yinF0 = getPitchYIN(dataTimeFast, sampleRate);
      } else {
        analyserDeep.getFloatTimeDomainData(dataTimeDeep);
        yinF0 = getPitchYIN(dataTimeDeep, sampleRate);
      }

      let activeF0 = -1;
      let isYinActive = false;

      if (yinF0 !== -1 && yinF0 > 25 && yinF0 < 4500) {
        lockedF0 = yinF0;
        activeF0 = yinF0;
        isYinActive = true;
      } else if (lockedF0 > 0 && (now - lastValidSignalMs < 3500)) {
        activeF0 = lockedF0;
        isYinActive = false;
      }

      if (activeF0 > 0) {
        const a4Freq = parseFloat(a4Input.value) || 440;
        const roughNoteInfo = calculateTuning(activeF0, a4Freq);
        
        if (roughNoteInfo.keyNum !== currentKeyNum || (now - lastValidSignalMs > 800)) {
          currentKeyNum = roughNoteInfo.keyNum;
          noteStartTimeMs = now;
          medianBHistory = [];
          medianF0History = [];
        }
        lastValidSignalMs = now;

        let extraction;

        if (!isDeepReady) {
          analyserFast.getFloatFrequencyData(dataFreqFast);
          const hzPerBinFast = nyquist / (FAST_FFT_SIZE / 2);
          extraction = extractDataFromSpectrum(activeF0, dataFreqFast, hzPerBinFast, nyquist);
          
          modeBadge.innerText = isYinActive ? "Echtzeit (Fast)" : "Track & Lock (Fast)";
          modeBadge.className = isYinActive ? "mode-badge mode-fast" : "mode-badge mode-hold";
        } else {
          analyserDeep.getFloatFrequencyData(dataFreqDeep);
          const hzPerBinDeep = nyquist / (analyserDeep.fftSize / 2);
          extraction = extractDataFromSpectrum(activeF0, dataFreqDeep, hzPerBinDeep, nyquist);
          
          modeBadge.innerText = isYinActive ? "Präzision (Deep)" : "Track & Lock (Deep)";
          modeBadge.className = isYinActive ? "mode-badge mode-deep" : "mode-badge mode-hold";
        }

        if (extraction.calcB >= 0.000005 && extraction.calcB <= 0.08) {
          medianBHistory.push(extraction.calcB);
          if (medianBHistory.length > 20) medianBHistory.shift(); 
        }

        medianF0History.push(extraction.exactF0);
        if (medianF0History.length > 15) medianF0History.shift();

        currentB = getMedian(medianBHistory);
        smoothedF0 = getMedian(medianF0History);
        
        const noteInfo = calculateTuning(smoothedF0, a4Freq);
        
        saveBtn.disabled = (currentB === 0);
        lastCents = noteInfo.cents;
        signalHoldCounter = SIGNAL_HOLD_FRAMES;

        // UI Updates
        noteEl.innerText = noteInfo.note;
        freqEl.innerText = smoothedF0.toFixed(2);
        pureTargetEl.innerText = noteInfo.pureTarget.toFixed(2) + " Hz";
        stretchedTargetEl.innerText = noteInfo.stretchedTarget.toFixed(2) + " Hz";

        centsEl.innerText = (noteInfo.cents >= 0 ? "+" : "") + noteInfo.cents.toFixed(1) + " Cts";
        stretchCentsEl.innerText = (noteInfo.stretchCents >= 0 ? "+" : "") + noteInfo.stretchCents.toFixed(1) + " Cts";
        centsContainer.className = Math.abs(noteInfo.cents) <= 1.5 ? "cents-display cents-perfect" : "cents-display cents-off";

        inharmonicityEl.innerText = currentB > 0 ? currentB.toExponential(2) : "Warte auf Partiale...";
        inharmonicityEl.style.color = currentB > 0 ? "#00fabd" : "#ffb4ab";

        drawStrobe(noteInfo.cents);
      } else {
        handleSignalHold();
      }
    } else {
      handleSignalHold();
    }
    requestAnimationFrame(analyze);
  }

  function handleSignalHold() {
    if (signalHoldCounter > 0) {
      signalHoldCounter--;
      drawStrobe(lastCents * (signalHoldCounter / SIGNAL_HOLD_FRAMES));
    } else {
      currentKeyNum = null;
      lockedF0 = -1;
      modeBadge.innerText = "Standby";
      modeBadge.className = "mode-badge";
      drawStrobe(0, true);
    }
  }
  
  analyze();
}

function findPartialPeak(dataArray, minHz, maxHz, hzPerBin) {
  const minBin = Math.max(1, Math.floor(minHz / hzPerBin));
  const maxBin = Math.min(dataArray.length - 2, Math.ceil(maxHz / hzPerBin));

  let maxVol = -Infinity;
  let peakBin = -1;

  for (let i = minBin; i <= maxBin; i++) {
    if (dataArray[i] > dataArray[i-1] && dataArray[i] > dataArray[i+1]) {
      if (dataArray[i] > maxVol) {
        maxVol = dataArray[i];
        peakBin = i;
      }
    }
  }
  if (peakBin !== -1 && maxVol > -100) {
    const exactBin = getInterpolatedPeakBin(dataArray, peakBin);
    return { freq: exactBin * hzPerBin, vol: maxVol };
  }
  return null;
}

function calculateTuning(freq, a4Freq) {
  const noteNum = 12 * (Math.log(freq / a4Freq) / Math.log(2)) + 69;
  const roundedNote = Math.round(noteNum);
  const pureTarget = a4Freq * Math.pow(2, (roundedNote - 69) / 12);
  const keyNum = roundedNote - 20;

  let globalB = 0.0004;
  if (keyNum >= 1 && keyNum <= 88) globalB = smoothedBModel[keyNum - 1] || 0.0004;

  const pivotKey = 49;
  const stretchFactorPerOctave = Math.sqrt(1 + globalB * 4);
  const distanceInOctaves = (keyNum - pivotKey) / 12;
  const cumulativeStretch = Math.pow(stretchFactorPerOctave, distanceInOctaves);

  const stretchedTarget = pureTarget * cumulativeStretch;
  const cents = 1200 * (Math.log(freq / stretchedTarget) / Math.log(2));
  const stretchCents = 1200 * (Math.log(stretchedTarget / pureTarget) / Math.log(2));

  const noteIndex = (roundedNote % 12 + 12) % 12;
  const octave = Math.floor(roundedNote / 12) - 1;

  return { keyNum, note: NOTE_NAMES[noteIndex] + octave, pureTarget, stretchedTarget, cents, stretchCents };
}

function drawStrobe(cents, idle = false) {
  sCtx.fillStyle = '#0a0a0c';
  sCtx.fillRect(0, 0, strobeCanvas.width, strobeCanvas.height);
  if (idle) return;

  strobePhase += cents * 0.15;
  sCtx.fillStyle = Math.abs(cents) < 1.5 ? '#00fabd' : '#d0bcff';

  const barWidth = 12; const spacing = 30;
  for (let x = (strobePhase % spacing) - spacing; x < strobeCanvas.width; x += spacing) {
    sCtx.fillRect(x, 0, barWidth, strobeCanvas.height);
  }
}

function updateGlobalModel() {
  const points = [];
  pianoData.forEach((val, idx) => {
    if (val !== null && val > 0) points.push({ key: idx + 1, b: val });
  });

  const validCount = points.length;
  progressText.innerText = `${validCount} / 88 Tasten eingemessen`;

  for (let i = 0; i < 88; i++) {
    let key = i + 1;
    let baseB = 0.00015;
    
    // ANGEPASST: Moderaterer Anstieg für ein Standard Upright-Klavier
    if (key < 40) baseB += 0.0011 * Math.pow((40 - key) / 40, 2.5);
    if (key > 40) baseB += 0.0023 * Math.pow((key - 40) / 48, 3);

    if (validCount === 0) {
      smoothedBModel[i] = baseB;
    } else {
      let numerator = 0; let denominator = 0.0001;
      const sigma = 8.0;
      points.forEach(p => {
        let dist = key - p.key;
        let weight = Math.exp(-(dist * dist) / (2 * sigma * sigma));
        
        let pBaseB = 0.00015;
        // ANGEPASST: Hier muss dieselbe moderatere Formel stehen!
        if (p.key < 40) pBaseB += 0.0011 * Math.pow((40 - p.key) / 40, 2.5);
        if (p.key > 40) pBaseB += 0.0023 * Math.pow((p.key - 40) / 48, 3);
        
        let measuredRatio = p.b / pBaseB;
        numerator += weight * measuredRatio;
        denominator += weight;
      });
      let ratio = numerator / denominator;
      let confidence = Math.min(1.0, denominator / 1.5);
      smoothedBModel[i] = baseB * (confidence * ratio + (1 - confidence) * 1.0);
    }
  }
  drawGraph(points);
}

function drawGraph(points) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#22222a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2); ctx.stroke();

  ctx.strokeStyle = '#d0bcff'; ctx.lineWidth = 2; ctx.beginPath();
  for (let i = 0; i < 88; i++) {
    const x = (i / 87) * (canvas.width - 20) + 10;
    const y = canvas.height - ((Math.log10(smoothedBModel[i]) + 4.5) / 2.5) * canvas.height;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  ctx.fillStyle = '#00fabd';
  points.forEach(p => {
    const x = ((p.key - 1) / 87) * (canvas.width - 20) + 10;
    const y = canvas.height - ((Math.log10(p.b) + 4.5) / 2.5) * canvas.height;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  });
}
</script>
