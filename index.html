<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Tuning Analyser - Master Pro Edition</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0c;
      color: #e0e0e0;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #16161a;
      border: 1px solid #2a2a35;
      border-radius: 16px;
      padding: 18px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.7);
      box-sizing: border-box;
      text-align: center;
    }
    h1 { font-size: 1.2rem; margin-top: 0; color: #d0bcff; letter-spacing: 0.5px; }
    
    .config-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e24;
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid #2d2d38;
    }
    .config-group label { font-size: 0.8rem; color: #aaa; }
    .config-group input {
      width: 60px;
      background: #111115;
      border: 1px solid #d0bcff;
      color: #fff;
      padding: 4px;
      border-radius: 4px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
    }

    button {
      background: #d0bcff;
      color: #111;
      border: none;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      margin-bottom: 8px;
      width: 100%;
      transition: all 0.2s;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { background: #333; color: #778; cursor: not-allowed; transform: none; }
    button.btn-save { background: #00fabd; margin-top: 6px; }
    button.btn-clear { background: #ffb4ab; color: #300; font-size: 0.75rem; padding: 5px 10px; margin-top: 8px; width: auto; }

    .note-display { font-size: 2.8rem; font-weight: 800; color: #fff; margin: 0; line-height: 1; }
    .freq-display { font-size: 1rem; color: #00fabd; margin-bottom: 4px; }
    
    .strobe-container {
      margin: 8px 0;
      background: #000;
      border-radius: 6px;
      border: 1px solid #333;
      overflow: hidden;
      height: 40px;
    }
    canvas#strobeCanvas {
      width: 100%;
      height: 40px;
    }

    .cents-display { font-size: 1.3rem; margin: 4px 0; font-weight: bold; }
    .cents-perfect { color: #00fabd; }
    .cents-off { color: #ffb4ab; }
    
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
      background: #1e1e24;
      padding: 8px;
      border-radius: 8px;
      text-align: left;
      font-size: 0.75rem;
      border: 1px solid #2d2d38;
    }
    .metrics div span { display: block; color: #8e8e99; }
    .metrics div strong { font-size: 0.85rem; color: #fff; }

    .section-title { font-size: 0.85rem; color: #d0bcff; margin: 12px 0 4px 0; text-align: left; font-weight: bold; }
    canvas#curveCanvas {
      width: 100%;
      height: 120px;
      background: #111115;
      border-radius: 6px;
      border: 1px solid #2d2d38;
    }
    .progress-bar { font-size: 0.75rem; color: #8e8e99; margin-top: 3px; }
    .legend {
      display: flex;
      justify-content: space-around;
      font-size: 0.7rem;
      margin-top: 4px;
      color: #aaa;
    }
    .legend span::before { content: "■ "; }
    .legend-dots::before { color: #00fabd; }
    .legend-line::before { color: #d0bcff; }
  </style>
</head>
<body>

<div class="card">
  <h1>Master Klavier-Stimmanalysator</h1>
  
  <div class="config-group">
    <label for="a4Input">Referenz A4 (Hz):</label>
    <input type="number" id="a4Input" value="440" step="0.1" min="400" max="480">
  </div>

  <button id="startBtn">1. Studio-Mikrofon starten</button>

  <div class="note-display" id="note">--</div>
  <div class="freq-display"><span id="freq">0.00</span> Hz</div>
  
  <div class="strobe-container">
    <canvas id="strobeCanvas" width="440" height="40"></canvas>
  </div>
  
  <div class="cents-display" id="centsContainer"><span id="cents">0.0</span> Cents</div>

  <div class="metrics">
    <div>
      <span>Reine Soll-Freq:</span>
      <strong id="pureTarget">-- Hz</strong>
    </div>
    <div>
      <span>Gespreizte Soll-Freq:</span>
      <strong id="stretchedTarget">-- Hz</strong>
    </div>
    <div>
      <span>Inharmonizität (B):</span>
      <strong id="inharmonicity">--</strong>
    </div>
    <div>
      <span>Spreizung (Offset):</span>
      <strong id="stretchCents">+0.0 Cts</strong>
    </div>
  </div>

  <button id="saveBtn" class="btn-save" disabled>2. Ton für Stimmkurve speichern</button>

  <div class="section-title">Inharmonizitäts-Profil (Multi-Partial Fit)</div>
  <canvas id="curveCanvas" width="400" height="120"></canvas>
  <div class="progress-bar" id="progressText">0 / 88 Tasten eingemessen</div>
  
  <div class="legend">
    <span class="legend-dots">Messpunkte</span>
    <span class="legend-line">Interpolierte Kurve</span>
  </div>

  <button id="clearBtn" class="btn-clear">Werksspeicher löschen</button>
</div>

<script>
let audioCtx, analyser, microphone;
let isListening = false;
let currentKeyNum = null;
let currentB = 0;
let bHistory = []; // Filter-Array für stabile B-Werte
let strobePhase = 0;

let pianoData = JSON.parse(localStorage.getItem('piano_pro_raw')) || new Array(88).fill(null);
let smoothedB = new Array(88).fill(0);

const startBtn = document.getElementById('startBtn');
const saveBtn = document.getElementById('saveBtn');
const clearBtn = document.getElementById('clearBtn');
const a4Input = document.getElementById('a4Input');

const noteEl = document.getElementById('note');
const freqEl = document.getElementById('freq');
const centsEl = document.getElementById('cents');
const centsContainer = document.getElementById('centsContainer');
const pureTargetEl = document.getElementById('pureTarget');
const stretchedTargetEl = document.getElementById('stretchedTarget');
const inharmonicityEl = document.getElementById('inharmonicity');
const stretchCentsEl = document.getElementById('stretchCents');
const progressText = document.getElementById('progressText');

const canvas = document.getElementById('curveCanvas');
const ctx = canvas.getContext('2d');
const strobeCanvas = document.getElementById('strobeCanvas');
const sCtx = strobeCanvas.getContext('2d');

const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

updateGlobalModel();

startBtn.addEventListener('click', async () => {
  if (isListening) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false }, 
      video: false 
    });
    
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    
    analyser = audioCtx.createAnalyser();
    
    let maxFftSize = 262144; // 262144 ist in fast allen Browsern das Maximum für WebAudio API
    while (maxFftSize >= 32) {
      try {
        analyser.fftSize = maxFftSize;
        break; 
      } catch (e) { maxFftSize /= 2; }
    }
    
    analyser.smoothingTimeConstant = 0.2; // Etwas mehr Smoothing für Stabilität

    microphone = audioCtx.createMediaStreamSource(stream);
    microphone.connect(analyser);

    isListening = true;
    startBtn.innerText = "Pro-Analysator aktiv";
    startBtn.style.background = "#00fabd";
    startBtn.style.color = "#000";

    processAudio();
  } catch (err) {
    alert("Mikrofon-Zugriff fehlgeschlagen: " + err);
  }
});

saveBtn.addEventListener('click', () => {
  if (currentKeyNum !== null && currentKeyNum >= 1 && currentKeyNum <= 88 && currentB > 0) {
    pianoData[currentKeyNum - 1] = currentB;
    localStorage.setItem('piano_pro_raw', JSON.stringify(pianoData));
    updateGlobalModel();
    bHistory = []; // Historie leeren nach Speichern
  }
});

clearBtn.addEventListener('click', () => {
  if (confirm("Kompletten Stimm-Speicher zurücksetzen?")) {
    pianoData = new Array(88).fill(null);
    localStorage.removeItem('piano_pro_raw');
    updateGlobalModel();
  }
});

// Parabolische Interpolation für exakte Frequenz zwischen den Bins (Log-Scale)
function getInterpolatedPeakBin(dataArray, bin) {
  if (bin <= 0 || bin >= dataArray.length - 1) return bin;
  const y1 = dataArray[bin - 1];
  const y2 = dataArray[bin];
  const y3 = dataArray[bin + 1];
  const p = 0.5 * (y1 - y3) / (y1 - 2 * y2 + y3);
  return bin + p;
}

// Helferfunktion für den Median
function getMedian(arr) {
  const sorted = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

function processAudio() {
  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Float32Array(bufferLength);
  
  function analyze() {
    if (!isListening) return;
    analyser.getFloatFrequencyData(dataArray);
    
    let maxVolume = -Infinity;
    let bestBin = -1;
    const nyquist = audioCtx.sampleRate / 2;
    const hzPerBin = nyquist / bufferLength;
    
    const minBin = Math.floor(27.5 / hzPerBin);
    const maxBin = Math.floor(4200 / hzPerBin);

    // 1. Finde den lautesten Peak
    for (let i = minBin; i < maxBin; i++) {
      if (dataArray[i] > maxVolume) {
        maxVolume = dataArray[i];
        bestBin = i;
      }
    }

    if (maxVolume > -75 && bestBin !== -1) {
      
      // 2. KORREKTUR: "Missing Fundamental" Check.
      // Ist der lauteste Peak eigentlich der 2. oder 3. Oberton?
      let fundBin = bestBin;
      for (let div = 4; div >= 2; div--) {
        let subBin = Math.round(bestBin / div);
        if (subBin > 0 && dataArray[subBin] > maxVolume - 20) { // Sub-Peak existiert stark genug
            // Überprüfe ob es ein lokales Maximum ist
            if (dataArray[subBin] > dataArray[subBin-1] && dataArray[subBin] > dataArray[subBin+1]) {
                fundBin = subBin;
                break; 
            }
        }
      }

      const exactPeakBin = getInterpolatedPeakBin(dataArray, fundBin);
      const fundFreq = exactPeakBin * hzPerBin;
      const a4Freq = parseFloat(a4Input.value) || 440;
      
      let partials = [{n: 1, freq: fundFreq, vol: dataArray[fundBin]}];
      
      // 3. Obertöne suchen (mit Inharmonizitäts-Toleranz nach oben)
      for (let n = 2; n <= 8; n++) {
        let expected = fundFreq * n;
        if (expected > nyquist * 0.8) break; // Nicht über Nyquist Grenze suchen
        
        let found = findPartialPeak(dataArray, expected, hzPerBin);
        if (found) partials.push({n: n, freq: found.freq, vol: found.vol});
      }

      // 4. Regression für B nur rechnen, wenn wir min. 3 Partials haben (stabiler)
      let calcB = 0;
      if (partials.length >= 3) {
        let N = partials.length;
        let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;

        for (let p of partials) {
          let x = p.n * p.n; // n^2
          let y = (p.freq * p.freq) / (p.n * p.n); // f_n^2 / n^2

          sumX += x;
          sumY += y;
          sumXY += x * y;
          sumX2 += x * x;
        }

        let denominator = (N * sumX2) - (sumX * sumX);
        if (denominator !== 0) {
          let m = ((N * sumXY) - (sumX * sumY)) / denominator;
          let c = (sumY - (m * sumX)) / N;

          if (c > 0 && m > 0) {
            calcB = m / c;
          }
        }
      }

      // 5. B-Wert glätten (Median-Filter über Zeit)
      if (calcB >= 0.000005 && calcB <= 0.08) {
        bHistory.push(calcB);
        if (bHistory.length > 20) bHistory.shift();
      }

      currentB = bHistory.length >= 5 ? getMedian(bHistory) : 0;
      saveBtn.disabled = (currentB === 0);

      // UI Updates
      const noteInfo = calculateTuning(fundFreq, a4Freq);
      currentKeyNum = noteInfo.keyNum;

      noteEl.innerText = noteInfo.note;
      freqEl.innerText = fundFreq.toFixed(2);
      pureTargetEl.innerText = noteInfo.pureTarget.toFixed(2) + " Hz";
      stretchedTargetEl.innerText = noteInfo.stretchedTarget.toFixed(2) + " Hz";
      
      centsEl.innerText = (noteInfo.cents >= 0 ? "+" : "") + noteInfo.cents.toFixed(1) + " Cts";
      stretchCentsEl.innerText = (noteInfo.stretchCents >= 0 ? "+" : "") + noteInfo.stretchCents.toFixed(1) + " Cts";
      
      centsContainer.className = Math.abs(noteInfo.cents) <= 1.5 ? "cents-display cents-perfect" : "cents-display cents-off";

      inharmonicityEl.innerText = currentB > 0 ? currentB.toExponential(2) : "Liest Partials...";
      inharmonicityEl.style.color = currentB > 0 ? "#00fabd" : "#ffb4ab";

      drawStrobe(noteInfo.cents);
    } else {
      bHistory = []; // Reset bei Stille
      drawStrobe(0, true); 
    }

    requestAnimationFrame(analyze);
  }
  analyze();
}

// Verbesserte Suchfunktion für Obertöne (Lokale Maxima)
function findPartialPeak(dataArray, targetFreq, hzPerBin) {
  // Asymmetrisches Fenster: Obertöne werden durch Inharmonizität schärfer (+6%), selten tiefer (-1.5%)
  const minBin = Math.floor((targetFreq * 0.985) / hzPerBin);
  const maxBin = Math.ceil((targetFreq * 1.06) / hzPerBin);
  
  let maxVol = -Infinity;
  let peakBin = -1;
  
  for (let i = minBin; i <= maxBin; i++) {
    // Es MUSS ein lokales Maximum sein (kleiner Hügel)
    if (dataArray[i] > dataArray[i-1] && dataArray[i] > dataArray[i+1]) {
        if (dataArray[i] > maxVol) {
          maxVol = dataArray[i];
          peakBin = i;
        }
    }
  }
  
  if (peakBin !== -1 && maxVol > -90) { // Muss über Rauschen liegen
    const exactBin = getInterpolatedPeakBin(dataArray, peakBin);
    return { freq: exactBin * hzPerBin, vol: maxVol };
  }
  return null;
}

// Korrigierte kumulative Berechnung der Spreizung
function calculateTuning(freq, a4Freq) {
  const noteNum = 12 * (Math.log(freq / a4Freq) / Math.log(2)) + 69;
  const roundedNote = Math.round(noteNum);
  const pureTarget = a4Freq * Math.pow(2, (roundedNote - 69) / 12);
  const keyNum = roundedNote - 20;

  let globalB = 0.0004;
  if (keyNum >= 1 && keyNum <= 88) {
    globalB = smoothedB[keyNum - 1] || 0.0004;
  }

  // Korrekte kumulative Railsback-Spreizung
  const pivotKey = 49; // A4
  const stretchFactorPerOctave = Math.sqrt(1 + globalB * 4); 
  
  // Verteilt die Oktav-Spreizung mathematisch über die Halbtöne Distanz zu A4
  const distanceInOctaves = (keyNum - pivotKey) / 12;
  const cumulativeStretch = Math.pow(stretchFactorPerOctave, distanceInOctaves);
  
  const stretchedTarget = pureTarget * cumulativeStretch;
  
  const cents = 1200 * (Math.log(freq / stretchedTarget) / Math.log(2));
  const stretchCents = 1200 * (Math.log(stretchedTarget / pureTarget) / Math.log(2));
  
  const noteIndex = (roundedNote % 12 + 12) % 12;
  const octave = Math.floor(roundedNote / 12) - 1;
  
  return {
    keyNum,
    note: NOTE_NAMES[noteIndex] + octave,
    pureTarget,
    stretchedTarget,
    cents,
    stretchCents
  };
}

function drawStrobe(cents, idle = false) {
  sCtx.fillStyle = '#0a0a0c';
  sCtx.fillRect(0, 0, strobeCanvas.width, strobeCanvas.height);

  if (idle) return;

  strobePhase += cents * 0.15;
  sCtx.fillStyle = Math.abs(cents) < 1.5 ? '#00fabd' : '#d0bcff';
  
  const barWidth = 12;
  const spacing = 30;
  for (let x = (strobePhase % spacing) - spacing; x < strobeCanvas.width; x += spacing) {
    sCtx.fillRect(x, 0, barWidth, strobeCanvas.height);
  }
}

// Interpolations-Modell bleibt unangetastet (war super)
function updateGlobalModel() {
  const points = [];
  pianoData.forEach((val, idx) => {
    if (val !== null && val > 0) points.push({ key: idx + 1, b: val });
  });

  const validCount = points.length;
  progressText.innerText = `${validCount} / 88 Tasten eingemessen`;

  if (validCount === 0) {
    for (let i = 0; i < 88; i++) {
      let key = i + 1;
      smoothedB[i] = key < 40 
        ? 0.00015 + 0.0015 * Math.pow((40 - key) / 40, 2)
        : 0.00015 + 0.0035 * Math.pow((key - 40) / 48, 3);
    }
  } else if (validCount === 1) {
    const single = points[0];
    let defaultB = single.key < 40 
      ? 0.00015 + 0.0015 * Math.pow((40 - single.key) / 40, 2)
      : 0.00015 + 0.0035 * Math.pow((single.key - 40) / 48, 3);
    
    const ratio = single.b / defaultB;
    for (let i = 0; i < 88; i++) {
      let key = i + 1;
      let baseB = key < 40 
        ? 0.00015 + 0.0015 * Math.pow((40 - key) / 40, 2)
        : 0.00015 + 0.0035 * Math.pow((key - 40) / 48, 3);
      smoothedB[i] = baseB * ratio;
    }
  } else {
    points.sort((a, b) => a.key - b.key);
    for (let i = 0; i < 88; i++) {
      let key = i + 1;
      if (key <= points[0].key) {
        let p1 = points[0], p2 = points[1];
        let slope = (Math.log(p2.b) - Math.log(p1.b)) / (p2.key - p1.key);
        smoothedB[i] = Math.exp(Math.log(p1.b) + slope * (key - p1.key));
      } else if (key >= points[points.length - 1].key) {
        let p1 = points[points.length - 2], p2 = points[points.length - 1];
        let slope = (Math.log(p2.b) - Math.log(p1.b)) / (p2.key - p1.key);
        smoothedB[i] = Math.exp(Math.log(p2.b) + slope * (key - p2.key));
      } else {
        for (let j = 0; j < points.length - 1; j++) {
          if (key >= points[j].key && key <= points[j + 1].key) {
            let p1 = points[j], p2 = points[j + 1];
            let t = (key - p1.key) / (p2.key - p1.key);
            smoothedB[i] = Math.exp(Math.log(p1.b) * (1 - t) + Math.log(p2.b) * t);
            break;
          }
        }
      }
    }
  }
  drawGraph(points);
}

function drawGraph(points) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#22222a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2); ctx.stroke();

  ctx.strokeStyle = '#d0bcff'; ctx.lineWidth = 2; ctx.beginPath();
  for (let i = 0; i < 88; i++) {
    const x = (i / 87) * (canvas.width - 20) + 10;
    const y = canvas.height - ((Math.log10(smoothedB[i]) + 4.5) / 2.5) * canvas.height;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  ctx.fillStyle = '#00fabd';
  points.forEach(p => {
    const x = ((p.key - 1) / 87) * (canvas.width - 20) + 10;
    const y = canvas.height - ((Math.log10(p.b) + 4.5) / 2.5) * canvas.height;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  });
}
</script>
</body>
</html>
